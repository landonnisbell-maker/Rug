<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PORPHYRA — Byzantine Rug</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #000;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        canvas {
            display: block;

            width: 100%;
            height: 100%;
        }

        #loading {
            position: fixed;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #000;

            color: #c8b99e;

            font-size: 12px;
            letter-spacing: 0.25em;

            z-index: 10;

            transition:
                opacity 0.6s ease,
                visibility 0.6s ease;
        }

        #loading.hidden {
            opacity: 0;
            visibility: hidden;
        }

        #error {
            position: fixed;

            left: 50%;
            bottom: 30px;

            transform: translateX(-50%);

            display: none;

            max-width: 90%;

            padding: 12px 18px;

            background: #220000;
            color: #ffdede;

            border: 1px solid #662222;

            font-size: 13px;

            z-index: 20;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three":
                "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

            "three/addons/":
                "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

    <div id="loading">
        PORPHYRA
    </div>

    <div id="error"></div>

    <script
        type="module"
        src="./main.js"
    ></script>

</body>
</html>
