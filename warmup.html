<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >


    <title>PORPHYRA Warmup</title>


    <script type="importmap">
    {
        "imports": {
            "three": "./vendor/three.module.js?v=180"
        }
    }
    </script>


    <!-- =====================================================
         PRELOAD MODULE GRAPH
         ===================================================== -->

    <link
        rel="modulepreload"
        href="./vendor/three.module.js?v=180"
    >

    <link
        rel="modulepreload"
        href="./vendor/environments/RoomEnvironment.js?v=180"
    >

    <link
        rel="modulepreload"
        href="./vendor/lights/RectAreaLightUniformsLib.js?v=180"
    >

    <link
        rel="modulepreload"
        href="./main.js?v=143"
    >


    <!-- =====================================================
         PRELOAD RUG TEXTURES
         ===================================================== -->

    <link
        rel="preload"
        href="./textures/porphyra_color.png?v=143"
        as="image"
        fetchpriority="high"
    >

    <link
        rel="preload"
        href="./textures/porphyra_material.png?v=143"
        as="image"
        fetchpriority="high"
    >

    <link
        rel="preload"
        href="./textures/rug_normal.png?v=143"
        as="image"
        fetchpriority="high"
    >


    <style>

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: transparent;

            pointer-events: none;
        }

    </style>

</head>


<body>


<script>

    // ======================================================
    // PORPHYRA ASSET WARMER
    //
    // Downloads but DOES NOT execute main.js.
    // Does not create WebGL.
    // Does not simulate the rug.
    // ======================================================


    const assets = [

        './main.js?v=143',

        './vendor/three.module.js?v=180',

        './vendor/environments/RoomEnvironment.js?v=180',

        './vendor/lights/RectAreaLightUniformsLib.js?v=180',

        './textures/porphyra_color.png?v=143',

        './textures/porphyra_material.png?v=143',

        './textures/rug_normal.png?v=143'

    ];


    async function warmAsset(
        url
    ) {

        try {

            const response =

                await fetch(

                    url,

                    {
                        method:
                            'GET',

                        cache:
                            'force-cache',

                        credentials:
                            'same-origin'
                    }

                );


            if (
                !response.ok
            ) {

                throw new Error(
                    `${response.status} ${response.statusText}`
                );

            }


            /*
                Consume the response so the browser completes
                the fetch rather than leaving the stream idle.
            */

            await response.arrayBuffer();


            return true;

        }
        catch (
            error
        ) {

            console.warn(
                'PORPHYRA warmup failed:',
                url,
                error
            );


            return false;

        }

    }


    const results =

        await Promise.all(

            assets.map(
                warmAsset
            )

        );


    const successful =

        results.filter(
            Boolean
        ).length;


    console.log(
        `PORPHYRA warmup: ${successful}/${assets.length} assets ready.`
    );


    window.parent.postMessage(

        {
            type:
                'PORPHYRA_WARMUP_COMPLETE',

            successful,

            total:
                assets.length
        },

        '*'

    );

</script>


</body>

</html>
