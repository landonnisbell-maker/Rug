<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>PORPHYRA Warmup</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: transparent;

            pointer-events: none;
        }
    </style>
</head>


<body>

<script>

    // ======================================================
    // PORPHYRA v14.3 ASSET WARMER
    //
    // Downloads the files needed by the rug into browser
    // cache WITHOUT creating a WebGL renderer.
    // ======================================================

    const assets = [

        './main.js?v=143',

        './vendor/three.module.js?v=180',
        './vendor/three.core.js',

        './vendor/environments/RoomEnvironment.js?v=180',

        './vendor/lights/RectAreaLightUniformsLib.js?v=180',
        './vendor/lights/RectAreaLightTexturesLib.js',

        './textures/porphyra_color.png?v=143',
        './textures/porphyra_material.png?v=143',
        './textures/rug_normal.png?v=143'

    ];


    async function warmAsset(url) {

        try {

            const response = await fetch(
                url,
                {
                    method: 'GET',
                    cache: 'force-cache',
                    credentials: 'same-origin'
                }
            );


            if (!response.ok) {

                throw new Error(
                    `${response.status} ${response.statusText}`
                );

            }


            await response.arrayBuffer();

            return true;

        }
        catch (error) {

            console.warn(
                'PORPHYRA warmup failed:',
                url,
                error
            );

            return false;

        }

    }


    const results = await Promise.all(
        assets.map(warmAsset)
    );


    const successful =
        results.filter(Boolean).length;


    console.log(
        `PORPHYRA warmup: ${successful}/${assets.length} assets ready.`
    );


    window.parent.postMessage(
        {
            type: 'PORPHYRA_WARMUP_COMPLETE',
            successful,
            total: assets.length
        },
        '*'
    );

</script>

</body>

</html>
