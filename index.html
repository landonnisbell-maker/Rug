<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PORPHYRA Rug</title>


    <!-- =====================================================
         CONNECTION WARM-UP
         ===================================================== -->

    <link
        rel="preconnect"
        href="https://cdn.jsdelivr.net"
        crossorigin
    >


    <!-- =====================================================
         PRELOAD PRODUCTION TEXTURES

         These URLs exactly match main.js.
         ===================================================== -->

    <link
        rel="preload"
        href="./textures/porphyra_color.png?v=142"
        as="image"
        fetchpriority="high"
    >

    <link
        rel="preload"
        href="./textures/porphyra_material.png?v=142"
        as="image"
        fetchpriority="high"
    >

    <link
        rel="preload"
        href="./textures/rug_normal.png?v=142"
        as="image"
        fetchpriority="high"
    >


    <!-- =====================================================
         PRELOAD THREE.JS MODULES
         ===================================================== -->

    <link
        rel="modulepreload"
        href="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    >

    <link
        rel="modulepreload"
        href="https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/environments/RoomEnvironment.js"
    >

    <link
        rel="modulepreload"
        href="https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/lights/RectAreaLightUniformsLib.js"
    >


    <!-- =====================================================
         IMPORT MAP
         ===================================================== -->

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>


    <style>

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: transparent !important;
        }


        body {
            position: relative;
        }


        #rugCanvas {
            position: absolute;

            inset: 0;

            display: block;

            width: 100% !important;
            height: 100% !important;

            margin: 0;
            padding: 0;

            border: 0;

            background: transparent !important;

            touch-action: none;
        }

    </style>

</head>


<body>

    <!--
        Nothing else exists on the page.

        No loading text.
        No preview image.
        No overlay.
        No fade.
    -->


    <script
        type="module"
        src="./main.js?v=142"
    ></script>

</body>

</html>
