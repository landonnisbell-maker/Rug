<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0
        "
    >

    <title>PORPHYRA Rug</title>


    <!-- =====================================================
         PORPHYRA v14.3
         RELIABILITY BUILD

         Everything is now served from this GitHub Pages site.
         No jsDelivr dependency at runtime.
         ===================================================== -->


    <!-- =====================================================
         LOCAL THREE.JS IMPORT MAP
         ===================================================== -->

    <script type="importmap">
    {
        "imports": {
            "three": "./vendor/three.module.js?v=180"
        }
    }
    </script>


    <!-- =====================================================
         PRELOAD LOCAL JAVASCRIPT
         ===================================================== -->

    <link
        rel="modulepreload"
        href="./vendor/three.module.js?v=180"
    >

    <link
        rel="modulepreload"
        href="./vendor/environments/RoomEnvironment.js?v=180"
    >

    <link
        rel="modulepreload"
        href="./vendor/lights/RectAreaLightUniformsLib.js?v=180"
    >

    <link
        rel="modulepreload"
        href="./main.js?v=143"
    >


    <!-- =====================================================
         PRELOAD RUG TEXTURES
         ===================================================== -->

    <link
        rel="preload"
        href="./textures/porphyra_color.png?v=143"
        as="image"
        fetchpriority="high"
    >

    <link
        rel="preload"
        href="./textures/porphyra_material.png?v=143"
        as="image"
        fetchpriority="high"
    >

    <link
        rel="preload"
        href="./textures/rug_normal.png?v=143"
        as="image"
        fetchpriority="high"
    >


    <style>

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            min-width: 1px;
            min-height: 1px;

            overflow: hidden;

            background: transparent !important;
        }


        html {
            position: fixed;

            inset: 0;
        }


        body {
            position: absolute;

            inset: 0;

            contain:
                layout
                paint
                size;
        }


        #rugCanvas {
            position: absolute;

            inset: 0;

            display: block;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            border: 0;
            outline: 0;

            background: transparent;

            touch-action: none;

            user-select: none;
            -webkit-user-select: none;
        }

    </style>

</head>


<body>

    <!--
        Canvas exists before JavaScript starts.

        This eliminates another DOM timing variable when
        running inside Wix.
    -->

    <canvas id="rugCanvas"></canvas>


    <script
        type="module"
        src="./main.js?v=143"
    ></script>

</body>

</html>
