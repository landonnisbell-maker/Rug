<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PORPHYRA Rug</title>


    <!-- =====================================================
         PRECONNECT

         Starts the connection to the Three.js CDN immediately.
         ===================================================== -->

    <link
        rel="preconnect"
        href="https://cdn.jsdelivr.net"
        crossorigin
    >


    <!-- =====================================================
         PRELOAD THE ACTUAL PRODUCTION TEXTURES

         These requests begin before main.js even starts.

         IMPORTANT:
         These URLs exactly match the URLs main.js requests,
         allowing the browser to reuse the downloaded files.
         ===================================================== -->

    <link
        rel="preload"
        href="./textures/porphyra_color.png?v=141"
        as="image"
        fetchpriority="high"
    >

    <link
        rel="preload"
        href="./textures/porphyra_material.png?v=141"
        as="image"
        fetchpriority="high"
    >

    <link
        rel="preload"
        href="./textures/rug_normal.png?v=141"
        as="image"
        fetchpriority="high"
    >


    <!-- =====================================================
         PRELOAD THREE.JS MODULES
         ===================================================== -->

    <link
        rel="modulepreload"
        href="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    >

    <link
        rel="modulepreload"
        href="https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/environments/RoomEnvironment.js"
    >

    <link
        rel="modulepreload"
        href="https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/lights/RectAreaLightUniformsLib.js"
    >


    <!-- =====================================================
         IMPORT MAP
         ===================================================== -->

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>


    <style>

        /* ==================================================
           COMPLETELY TRANSPARENT DOCUMENT
           ================================================== */

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: transparent !important;
        }


        body {
            position: relative;
        }


        /* ==================================================
           REAL THREE.JS CANVAS

           It begins invisible.

           main.js makes it visible only AFTER the first real
           rug frame has successfully rendered.
           ================================================== */

        #rugCanvas {
            position: absolute;

            inset: 0;

            display: block;

            width: 100% !important;
            height: 100% !important;

            background: transparent !important;

            opacity: 0;

            transition:
                opacity 120ms ease-out;

            z-index: 2;
        }


        #rugCanvas.ready {
            opacity: 1;
        }


        /* ==================================================
           INSTANT RUG PREVIEW

           Uses the SAME pre-baked color texture that Three.js
           needs anyway.

           Therefore we're not introducing another large image
           download just to make a loading screen.
           ================================================== */

        #rugPreview {
            position: absolute;

            left: 50%;
            top: 50%;

            /*
                This roughly matches the camera framing of
                the actual Three.js rug.
            */

            width:
                min(
                    89vw,
                    calc(89vh * 1.773584906)
                );

            aspect-ratio:
                9.4 / 5.3;

            transform:
                translate(
                    -50%,
                    -50%
                );


            /*
                Three.js repeats the texture approximately:

                X = 2.8377 times
                Y = 1.6 times

                CSS size is therefore:

                X = 100 / 2.8377 ≈ 35.24%
                Y = 100 / 1.6    = 62.5%
            */

            background-image:
                url("./textures/porphyra_color.png?v=141");

            background-repeat:
                repeat;

            background-size:
                35.24%
                62.5%;


            opacity: 1;

            transition:
                opacity 120ms ease-out;

            pointer-events: none;

            z-index: 1;
        }


        /* ==================================================
           PREVIEW BORDER

           Approximates the actual shader border while the
           Three.js rug finishes loading.
           ================================================== */

        #rugPreview::before {
            content: "";

            position: absolute;

            inset: 0;

            pointer-events: none;

            box-shadow:

                inset
                0
                0
                0
                2px
                #100812,

                inset
                0
                0
                0
                5px
                #593044,

                inset
                0
                0
                0
                clamp(
                    12px,
                    1.65vw,
                    28px
                )
                #271329;
        }


        /* ==================================================
           APPROXIMATE CINEMATIC LIGHTING DURING PREVIEW

           This prevents the preview from looking like a
           completely flat texture before Three.js appears.
           ================================================== */

        #rugPreview::after {
            content: "";

            position: absolute;

            inset: 0;

            pointer-events: none;

            background:

                linear-gradient(
                    135deg,

                    rgba(
                        255,
                        213,
                        167,
                        0.12
                    )
                    0%,

                    rgba(
                        255,
                        213,
                        167,
                        0.035
                    )
                    28%,

                    rgba(
                        0,
                        0,
                        0,
                        0
                    )
                    55%,

                    rgba(
                        8,
                        2,
                        13,
                        0.13
                    )
                    100%
                );
        }


        /* ==================================================
           PREVIEW REMOVAL
           ================================================== */

        #rugPreview.hidden {
            opacity: 0;
        }

    </style>

</head>


<body>


    <!-- =====================================================
         IMMEDIATE VISUAL PLACEHOLDER

         NO PORPHYRA TEXT.
         NO BLACK SCREEN.
         NO LOADING SPINNER.
         ===================================================== -->

    <div
        id="rugPreview"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         THREE.JS
         ===================================================== -->

    <script
        type="module"
        src="./main.js?v=141"
    ></script>


</body>

</html>
